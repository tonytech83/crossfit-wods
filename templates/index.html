{% extends "base.html" %} {% block content %}

<h1>Chose your training</h1>
<div class="wods-list">
  {% for wod in data %}
  <a href="/data/{{ wod.filename }}">
    <div class="wod-item">
      <p>{{ wod.idx }}</p>
      <p>{{ wod.formatted_date }}</p>
    </div>
  </a>
  {% endfor %}
</div>

{% endblock %}
